name: 🚀 Build & Release Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'
          cache: true

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🔑 Inject environment variables
        run: |
          echo "GITHUB_REPO=${{ github.repository }}" >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}" >> .env

      - name: 🔥 Restore Firebase config files
        run: |
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode --ignore-garbage > lib/firebase_options.dart
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode --ignore-garbage > android/app/google-services.json

      - name: 📋 Prepare release metadata
        id: meta
        # Only needed for releases on main, but safe to run on PRs too
        run: |
          set -euo pipefail
          APP_VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')"
          TAG_NAME="v${APP_VERSION}-build-${GITHUB_RUN_NUMBER}"
          APK_NAME="MealMitra-${APP_VERSION}-build-${GITHUB_RUN_NUMBER}.apk"

          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: 🛠️ Build release APK
        run: flutter build apk --release --build-name=${{ steps.meta.outputs.app_version }} --build-number=${{ github.run_number }} --dart-define-from-file=.env

      - name: 📦 Prepare release artifact
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          APK_SOURCE="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK_SOURCE"
          cp "$APK_SOURCE" "release-artifacts/${{ steps.meta.outputs.apk_name }}"

      - name: 📤 Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: release-artifacts/${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error

      # Only publish a GitHub Release on pushes to main, not on PRs
      - name: 🚀 Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: MealMitra ${{ steps.meta.outputs.app_version }} (Build ${{ github.run_number }})
          generate_release_notes: true
          files: release-artifacts/${{ steps.meta.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
