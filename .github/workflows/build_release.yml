name: Build and Release CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Inject Secure Environment Variables
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> .env
          echo "CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}" >> .env

      - name: Inject Google Services & Firebase Options
        run: |
          # The GOOGLE_SERVICES_JSON Github Secret should contain the base64 encoded string of your google-services.json file
          # To create the base64 string locally, run: base64 -i android/app/google-services.json -o base64_secret.txt
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode --ignore-garbage > android/app/google-services.json
          
          # The FIREBASE_OPTIONS_DART Github Secret should contain the base64 encoded string of your local lib/firebase_options.dart 
          # Run: base64 -i lib/firebase_options.dart -o base64_options.txt
          echo "${{ secrets.FIREBASE_OPTIONS_DART }}" | base64 --decode --ignore-garbage > lib/firebase_options.dart

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
