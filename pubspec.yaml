name: mealmitra
description: "Your AI Nutrition Companion"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  http: ^1.2.0
  shared_preferences: ^2.3.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  fl_chart: ^0.71.0
  lucide_icons_flutter: ^1.1.0
  flutter_svg: ^2.0.10

  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.5

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Client-side AI (for Firebase mode)
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# ─── Launcher Icons Config ─────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 21

# ─── Native Splash Config ──────────────────────────────────
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo.png"
  color_dark: "#0D1B2A"
  image_dark: "assets/images/splash_logo.png"
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: "assets/images/app_logo.png"
    color_dark: "#0D1B2A"
    icon_background_color_dark: "#0D1B2A"
    image_dark: "assets/images/app_logo.png"

